<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentLab</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Highlight.js for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-darker border-end border-secondary sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading fs-4 fw-bold text-accent py-4 px-3">
                <i class="fa-solid fa-flask"></i> AgentLab
            </div>
            <div class="list-group list-group-flush px-2">
                <a href="{{ url_for('index') }}" class="list-group-item list-group-item-action bg-transparent text-light border-0 rounded mb-1 rounded-3">
                    <i class="fa-solid fa-plus me-2"></i> New Project
                </a>
                <a href="{{ url_for('projects') }}" class="list-group-item list-group-item-action bg-transparent text-light border-0 rounded rounded-3">
                    <i class="fa-solid fa-layer-group me-2"></i> My Projects
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100 flex-grow-1 overflow-hidden d-flex flex-column">
            <nav class="navbar navbar-expand-lg navbar-dark bg-darker border-bottom border-secondary px-4 py-3">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">{% block header_title %}Workspace{% endblock %}</span>
                </div>
            </nav>
            <div class="container-fluid p-4 overflow-auto flex-grow-1">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
